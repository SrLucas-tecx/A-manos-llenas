<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Administración — A Manos Llenas</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header class="site-header" id="site-header"></header>

<section>
  <div class="wrap">
    <div class="section-head">
      <div>
        <h2>Panel de administración</h2>
        <p class="lede">Monitoreo de incumplimientos, bajas de empresas y reporte de impacto para auditoría externa.</p>
      </div>
    </div>

    <div class="kpi-row" id="admin-kpis"></div>

    <h3>Empresas registradas</h3>
    <table style="margin-bottom:40px;">
      <thead>
        <tr>
          <th>Empresa</th>
          <th>Correo</th>
          <th>Incumplimientos</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="admin-empresas-body"></tbody>
    </table>

    <h3>Reportes de donaciones deficientes</h3>
    <div id="admin-denuncias"></div>
  </div>
</section>

<script type="module" src="js/admin-page.js"></script>
</body>
</html>
