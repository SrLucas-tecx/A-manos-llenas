<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Registro — A Manos Llenas</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header class="site-header" id="site-header"></header>

<section>
  <div class="wrap form-shell">
    <div class="card">
      <h2>Crea tu cuenta</h2>
      <div class="tabs">
        <div class="tab active" data-tab="empresa">Soy empresa</div>
        <div class="tab" data-tab="organizacion">Soy organización social</div>
      </div>

      <div id="panel-empresa">
        <div class="form-msg" id="msg-empresa"></div>
        <form id="form-empresa">
          <div class="field">
            <label for="e-nombre">Nombre de la empresa</label>
            <input id="e-nombre" name="nombre" required placeholder="Panificadora Trigo Dorado" />
          </div>
          <div class="field">
            <label for="e-email">Correo</label>
            <input id="e-email" name="email" type="email" required placeholder="contacto@empresa.mx" />
          </div>
          <div class="field">
            <label for="e-password">Contraseña</label>
            <input id="e-password" name="password" type="password" required minlength="4" />
          </div>
          <div class="field">
            <label for="e-contacto">Teléfono de contacto</label>
            <input id="e-contacto" name="contacto" required placeholder="55 1234 5678" />
          </div>
          <div class="field">
            <label for="e-ubicacion">Ubicación</label>
            <input id="e-ubicacion" name="ubicacion" required placeholder="Ciudad, estado" />
          </div>
          <button class="btn" type="submit" style="width:100%;">Registrar empresa</button>
        </form>
      </div>

      <div id="panel-org" style="display:none;">
        <div class="form-msg" id="msg-org"></div>
        <form id="form-org">
          <div class="field">
            <label for="o-nombre">Nombre de la organización</label>
            <input id="o-nombre" name="nombre" required placeholder="Centro de Acopio Pelusas" />
          </div>
          <div class="field">
            <label for="o-email">Correo</label>
            <input id="o-email" name="email" type="email" required placeholder="contacto@organizacion.org" />
          </div>
          <div class="field">
            <label for="o-password">Contraseña</label>
            <input id="o-password" name="password" type="password" required minlength="4" />
          </div>
          <div class="field">
            <label for="o-contacto">Teléfono de contacto</label>
            <input id="o-contacto" name="contacto" required placeholder="722 111 2233" />
          </div>
          <div class="field">
            <label for="o-ubicacion">Ubicación</label>
            <input id="o-ubicacion" name="ubicacion" required placeholder="Ciudad, estado" />
          </div>
          <div class="field">
            <label for="o-capacidad">Capacidad de recepción</label>
            <input id="o-capacidad" name="capacidad" required placeholder="Ej. 200 kg / semana" />
          </div>
          <button class="btn" type="submit" style="width:100%;">Registrar organización</button>
        </form>
      </div>

      <p class="helper">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>.</p>
    </div>
  </div>
</section>

<script type="module" src="js/registro.js"></script>
</body>
</html>
