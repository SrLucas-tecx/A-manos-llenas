<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iniciar sesión — A Manos Llenas</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header class="site-header" id="site-header"></header>

<section>
  <div class="wrap form-shell">
    <div class="card">
      <h2>Iniciar sesión</h2>
      <p class="lede" style="margin-bottom:22px;">Elige con qué tipo de cuenta quieres entrar.</p>

      <div class="role-toggle">
        <button type="button" data-rol="empresa" class="active">Empresa</button>
        <button type="button" data-rol="organizacion">Organización</button>
        <button type="button" data-rol="admin">Administración</button>
      </div>

      <div class="form-msg" id="login-msg"></div>

      <form id="form-login">
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" required placeholder="tucorreo@ejemplo.com" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required placeholder="••••••••" />
        </div>
        <button class="btn" type="submit" style="width:100%;">Entrar</button>
      </form>

      <p class="helper">
        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>.<br />
        Prueba con <strong>contacto@trigodorado.mx</strong> / <strong>123456</strong> (empresa),
        <strong>laura@pelusas.org</strong> / <strong>123456</strong> (organización) o
        <strong>admin@amanosllenas.org</strong> / <strong>admin123</strong> (administración).
      </p>
    </div>
  </div>
</section>

<script type="module" src="js/login.js"></script>
</body>
</html>
