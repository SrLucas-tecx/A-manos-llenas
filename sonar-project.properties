# Configuración de SonarQube / SonarQube Cloud (la usa el job "sonarqube" del pipeline)

# Identificador del proyecto. En SonarQube Cloud se ve en Information del proyecto.
sonar.projectKey=SrLucas-tecx_A-manos-llenas
sonar.projectName=A Manos Llenas

# Solo para SonarQube Cloud: la "organization key" de su cuenta. Con un SonarQube propio, borren esta línea.
sonar.organization=srlucas-tecx

# Código a analizar (backend y frontend)
sonar.sources=src,client/src
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,src/test/**

# Pruebas
sonar.tests=src/test
sonar.test.inclusions=src/test/**/*.test.js

# Reporte de cobertura que genera Jest (npm test)
sonar.javascript.lcov.reportPaths=src/coverage/lcov.info

sonar.sourceEncoding=UTF-8
